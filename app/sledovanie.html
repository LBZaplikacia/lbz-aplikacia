<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kde je furman – Legendárne buchty Zbojská</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#583934">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --hneda: #583934; --zlata: #d1a73a; --krem: #fbf6ec; --text: #2b211f; --muted: #7a6a66; --karta: #ffffff; --ok: #2f7d4f; --zle: #a63d32; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: Montserrat, system-ui, sans-serif; background: var(--krem); color: var(--text); display: flex; flex-direction: column; }
  header { background: var(--hneda); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  header img { width: 40px; height: 40px; }
  header b { display: block; font-size: 15px; }
  header span { font-size: 12px; opacity: .85; }
  #mapa { flex: 1; min-height: 300px; display: none; }
  .panel { background: var(--karta); margin: 12px 16px 16px; padding: 16px; border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .panel h1 { font-size: 18px; margin: 0 0 6px; }
  .panel p { margin: 6px 0; line-height: 1.45; }
  .velke { font-size: 26px; font-weight: 800; color: var(--hneda); }
  .muted { color: var(--muted); font-size: 13px; }
  .pill { display: inline-block; background: var(--zlata); color: #fff; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; }
  .ok { color: var(--ok); } .zle { color: var(--zle); }
  .auto-ikona { filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
  .ciel-ikona { font-size: 28px; line-height: 28px; text-align: center; }
  footer { text-align: center; font-size: 11px; color: var(--muted); padding: 0 16px 16px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<header>
  <img src="icons/logo.svg" alt="">
  <div><b>Legendárne buchty Zbojská</b><span>Sledovanie furmanky</span></div>
</header>
<div id="mapa" aria-label="Mapa s polohou furmana"></div>
<section class="panel" id="info" aria-live="polite"><p class="muted">Načítavam…</p></section>
<footer>Poloha furmana sa zobrazuje len v deň rozvozu, kým nie je vaša objednávka doručená.
  <a href="https://www.legendarnebuchty.sk/ochrana-sukromia" target="_blank" rel="noopener">Ochrana osobných údajov</a></footer>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  "use strict";
  var FIAT = "https://buchty.s26.cdn-upgates.com/1/169c501e8598cd-fiat-s-buchtou.png";
  var param = new URLSearchParams(location.search);
  var token = param.get("t") || "", DEMO = param.get("demo") === "1";
  var info = document.getElementById("info"), mapaEl = document.getElementById("mapa");
  var mapa = null, auto = null, ciel = null, ciara = null, ciaraObrys = null, poslednaCesta = "", prvy = true, casovac = null;

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function cas(iso) { return iso ? new Date(iso).toLocaleTimeString("sk-SK", { timeZone: "Europe/Bratislava", hour: "2-digit", minute: "2-digit" }) : ""; }
  function datum(iso) { if (!iso) return ""; var p = String(iso).slice(0, 10).split("-"); return +p[2] + ". " + +p[1] + ". " + p[0]; }
  function zastavky(n) { return n === 1 ? "1 zastávka" : n >= 2 && n <= 4 ? n + " zastávky" : n + " zastávok"; }
  // Google encoded polyline → [[lat, lng], …]
  function dekoduj(str) {
    var i = 0, lat = 0, lng = 0, out = [];
    while (i < str.length) {
      var b, s = 0, r = 0; do { b = str.charCodeAt(i++) - 63; r |= (b & 31) << s; s += 5; } while (b >= 32); lat += (r & 1) ? ~(r >> 1) : (r >> 1);
      s = 0; r = 0; do { b = str.charCodeAt(i++) - 63; r |= (b & 31) << s; s += 5; } while (b >= 32); lng += (r & 1) ? ~(r >> 1) : (r >> 1);
      out.push([lat / 1e5, lng / 1e5]);
    }
    return out;
  }

  function ukazMapu(d) {
    if (!window.L) return;
    mapaEl.style.display = "block";
    if (!mapa) {
      mapa = L.map(mapaEl, { zoomControl: true, attributionControl: true });
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "© OpenStreetMap" }).addTo(mapa);
      mapa.setView([48.7, 19.7], 7);
      setTimeout(function () { mapa.invalidateSize(); }, 50);
    }
    if (d.cesta && d.cesta !== poslednaCesta) {
      poslednaCesta = d.cesta;
      var body = dekoduj(d.cesta);
      if (ciara) { ciara.setLatLngs(body); ciaraObrys.setLatLngs(body); }
      else {
        ciaraObrys = L.polyline(body, { color: "#583934", weight: 8, opacity: 0.35 }).addTo(mapa);
        ciara = L.polyline(body, { color: "#d1a73a", weight: 5, opacity: 0.95 }).addTo(mapa);
      }
    }
    if (d.ciel && !ciel) {
      ciel = L.marker([d.ciel.lat, d.ciel.lng], { icon: L.divIcon({ className: "ciel-ikona", html: "🏠", iconSize: [28, 28], iconAnchor: [14, 14] }), title: "Vaša adresa", zIndexOffset: 500 }).addTo(mapa);
    }
    if (d.auto) {
      var poz = [d.auto.lat, d.auto.lng];
      if (!auto) auto = L.marker(poz, { icon: L.icon({ iconUrl: FIAT, iconSize: [84, 80], iconAnchor: [42, 70], className: "auto-ikona" }), title: "Furman", zIndexOffset: 1000 }).addTo(mapa);
      else auto.setLatLng(poz);
    }
    if (prvy) {
      var hranice = ciara ? ciara.getBounds() : null;
      if (!hranice && d.auto && d.ciel) hranice = L.latLngBounds([[d.auto.lat, d.auto.lng], [d.ciel.lat, d.ciel.lng]]);
      if (hranice) { mapa.fitBounds(hranice, { padding: [50, 50], maxZoom: 15, animate: false }); prvy = false; }
      else if (d.auto || d.ciel) { var p = d.auto || d.ciel; mapa.setView([p.lat, p.lng], 13, { animate: false }); prvy = false; }
    }
  }
  function skryMapu() { mapaEl.style.display = "none"; }

  var RYCHLO = false; // posledných ~10 min pred príchodom (ste na rade) sa poloha obnovuje každé 3 s
function vykresli(d) {
RYCHLO = false;
    if (!d || d.ok === false) { skryMapu(); info.innerHTML = "<h1>Odkaz nie je platný</h1><p>Skontrolujte, či ste otvorili celý odkaz zo SMS. Ak potrebujete pomôcť, odpovedzte nám na SMS alebo napíšte na eshop@legendarnebuchty.sk.</p>"; return false; }
    var c = d.cislo ? " č. " + esc(d.cislo) : "";
    var prichod = d.eta_live || d.eta;
RYCHLO = d.stav === "na_ceste" && !d.pred_vami && !!prichod && new Date(prichod).getTime() - Date.now() < 10 * 60000;
    switch (d.stav) {
      case "stare": skryMapu(); info.innerHTML = "<h1>Rozvoz už prebehol</h1><p>Sledovanie je dostupné len v deň rozvozu.</p>"; return false;
      case "dorucene": skryMapu(); info.innerHTML = '<h1 class="ok">✓ Objednávka' + c + " je doručená</h1>" + (d.cas ? "<p>Doručené o " + esc(cas(d.cas)) + ".</p>" : "") + "<p>Ďakujeme a dobrú chuť! 🥮</p>"; return false;
      case "nedorucene": skryMapu(); info.innerHTML = '<h1 class="zle">Objednávku' + c + " sa dnes nepodarilo doručiť</h1><p>Ozveme sa vám a dohodneme nový termín.</p>"; return false;
      case "ukoncena": skryMapu(); info.innerHTML = "<h1>Dnešný rozvoz je ukončený</h1><p>Ak ste objednávku nedostali, ozvite sa nám prosím.</p>"; return false;
      case "neskor": skryMapu(); info.innerHTML = "<h1>Vaša objednávka" + c + "</h1><p>Rozvoz bude <b>" + esc(datum(d.datum)) + "</b>" + (d.eta ? ", plánovaný príchod okolo " + esc(cas(d.eta)) : "") + ".</p><p class=\"muted\">V deň rozvozu tu uvidíte, kde je furman práve teraz.</p>"; return true;
      case "pripravujeme":
      case "na_ceste":
        ukazMapu(d);
        info.innerHTML = "<h1>" + (d.stav === "na_ceste" ? "Furman je na ceste 🚚" : "Furman sa chystá na cestu") + "</h1>" +
          (prichod ? '<p>Plánovaný príchod: <span class="velke">' + esc(cas(prichod)) + "</span>" + (d.eta_live ? '<br><span class="muted">podľa aktuálnej polohy auta a dopravy</span>' : "") + "</p>" : "") +
          (d.stav === "na_ceste" ? '<p><span class="pill">' + (d.pred_vami ? "pred vami ešte " + zastavky(d.pred_vami) : "ste na rade 👋") + "</span></p>" : "") +
          (d.auto ? '<p class="muted">' + (DEMO ? "UKÁŽKA – auto sa pohybuje zrýchlene, čas príchodu sa mení len podľa dopravy" : "Poloha auta z " + esc(cas(d.auto.kedy)) + " · obnovuje sa samo") + "</p>" : '<p class="muted">Poloha auta sa zobrazí, keď sa furman vydá na cestu.</p>');
        return true;
    }
    skryMapu(); info.innerHTML = "<p>Stav sa nepodarilo zistiť.</p>"; return true;
  }

  function volaj(telo) {
    var cfg = window.LBZ_CONFIG || {};
    var h = { "Content-Type": "application/json" };
    if (cfg.supabaseAnonKey) h.apikey = cfg.supabaseAnonKey;
    return fetch(cfg.supabaseUrl + "/functions/v1/sledovanie", { method: "POST", headers: h, body: JSON.stringify(telo) })
      .then(function (r) { return r.ok ? r.json() : { ok: false }; });
  }
  function nacitaj() {
    var cfg = window.LBZ_CONFIG || {};
    if (!token || !cfg.supabaseUrl) { vykresli({ ok: false }); return; }
    volaj({ t: token })
      .then(function (d) { var dalej = vykresli(d); if (dalej) planuj(); })
      .catch(function () { info.innerHTML = '<p class="muted">Bez pripojenia – skúsim znova o chvíľu.</p>'; planuj(); });
  }
  function planuj() { clearTimeout(casovac); casovac = setTimeout(nacitaj, document.hidden ? 60000 : RYCHLO ? 3000 : 20000); }

  // ukážka (?demo=1): auto ide po skutočnej trase Brezno → Banská Bystrica zrýchlene (celá cesta za ~90 s)
  function ukazka() {
    volaj({ demo: true }).then(function (d) {
      var body = d.polyline ? dekoduj(d.polyline) : [[d.start.lat, d.start.lng], [d.ciel.lat, d.ciel.lng]];
      var dlzky = [0]; for (var i = 1; i < body.length; i++) dlzky.push(dlzky[i - 1] + Math.hypot(body[i][0] - body[i - 1][0], body[i][1] - body[i - 1][1]));
      var spolu = dlzky[dlzky.length - 1] || 1, TRVANIE = 90000, start = Date.now(), ETA0 = start + ((d.trvanie_s || 3600) + 600) * 1000;
      function bodNa(f) { var cie = f * spolu, k = 1; while (k < dlzky.length - 1 && dlzky[k] < cie) k++; var u = (cie - dlzky[k - 1]) / ((dlzky[k] - dlzky[k - 1]) || 1); return [body[k - 1][0] + (body[k][0] - body[k - 1][0]) * u, body[k - 1][1] + (body[k][1] - body[k - 1][1]) * u]; }
      function krok() {
        var f = Math.min(1, (Date.now() - start) / TRVANIE);
        if (f >= 1) { vykresli({ ok: true, stav: "dorucene", cislo: "UKÁŽKA", cas: new Date().toISOString() }); setTimeout(function () { location.reload(); }, 6000); return; }
        var p = bodNa(f), zostava = (1 - f) * (d.trvanie_s || 3600);
        var ki = 1; while (ki < dlzky.length - 1 && dlzky[ki] < f * spolu) ki++; var zv = [p].concat(body.slice(ki));
        if (!mapa) { mapaEl.style.display = "block"; mapa = L.map(mapaEl).setView([d.ciel.lat, d.ciel.lng], 10, { animate: false }); L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "© OpenStreetMap" }).addTo(mapa); }
        if (ciara) { ciara.setLatLngs(zv); ciaraObrys.setLatLngs(zv); }
        else { ciaraObrys = L.polyline(zv, { color: "#583934", weight: 8, opacity: 0.35 }).addTo(mapa); ciara = L.polyline(zv, { color: "#d1a73a", weight: 5, opacity: 0.95 }).addTo(mapa); }
        vykresli({ ok: true, stav: "na_ceste", cislo: "UKÁŽKA", pred_vami: f < 0.33 ? 2 : f < 0.66 ? 1 : 0, ciel: d.ciel,
          auto: { lat: p[0], lng: p[1], kedy: new Date().toISOString() }, eta_live: new Date(ETA0 + Math.round(2 * Math.sin(f * Math.PI * 3)) * 60000).toISOString() });
        setTimeout(krok, 250);
      }
      krok();
    }).catch(function () { info.innerHTML = "<p>Ukážku sa nepodarilo načítať.</p>"; });
  }

  document.addEventListener("visibilitychange", function () { if (!document.hidden && !DEMO) { clearTimeout(casovac); nacitaj(); } });
  if (DEMO) ukazka(); else nacitaj();
})();
</script>
</body>
</html>
